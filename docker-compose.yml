services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chm
      POSTGRES_PASSWORD: chm
      POSTGRES_DB: experiment
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chm -d experiment"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://chm:chm@db:5432/experiment
      CONFIG_PATH: /app/config.yml
      CONDITION: ${CONDITION:-}                 # optional override of active_condition
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./config.yml:/app/config.yml:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
